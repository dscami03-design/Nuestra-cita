<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una cita especial ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');

:root {
  --pink:#e8aab9;
  --dark:#824c5c;
  --cream:#fff8f0;
  --light:#f9e9e9;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  background:linear-gradient(145deg,#f9e9e9,#fff8f0,#f6dce3);
  color:#60434a;
  font-family:'DM Sans',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  /* Pequeños iconos decorativos de fondo */
  background-image: 
    radial-gradient(#e8aab9 15%, transparent 16%),
    radial-gradient(#e8aab9 15%, transparent 16%);
  background-size: 60px 60px;
  background-position: 0 0, 30px 30px;
  background-color: #fff8f0;
}
.card {
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,.96);
  border:1px solid white;
  border-radius:28px;
  padding:30px 22px;
  text-align:center;
  box-shadow:0 15px 50px #a66b7720;
  animation:appear .55s ease;
  position: relative;
  overflow: hidden;
}
@keyframes appear {
  from {opacity:0;transform:translateY(18px)}
  to {opacity:1;transform:translateY(0)}
}
h1,h2 {font-family:'Playfair Display',serif;color:var(--dark);margin: 10px 0;}
h1 {font-size:28px;line-height:1.2}
h2 {font-size:24px}
p {line-height:1.5;font-size:14px;margin: 10px 0;}
.buttons {display:flex;gap:12px;margin-top:20px}
button {
  font-family:inherit;
  cursor:pointer;
  border:0;
  border-radius:16px;
  padding:14px 18px;
  font-size:15px;
  font-weight:600;
  transition:.2s;
}
button:active {transform:scale(.97)}
.primary {background:var(--dark);color:white;flex:1}
.secondary {background:#f5e5e8;color:var(--dark);flex:1}
.full {width:100%;margin-top:16px}

/* Opciones elegantes solo texto con iconos */
.options-stack {
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:20px;
}
.option-btn {
  width:100%;
  background:#fffafa;
  border:2px solid #f1dce1;
  color:var(--dark);
  text-align:left;
  padding: 16px 20px;
  border-radius:16px;
  font-weight:600;
  font-size:15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.2s ease;
}
.option-btn span.icon {
  font-size: 18px;
}
.option-btn.selected {
  border-color:#a65d75;
  background:#fceaf0;
  box-shadow:0 0 0 3px #e8aab933;
  transform: translateX(4px);
}

textarea {
  width:100%;
  border:1px solid #e8cbd3;
  background:#fffafa;
  border-radius:14px;
  padding:14px;
  font-family:inherit;
  color:#60434a;
  font-size:14px;
  margin-top:12px;
  outline:none;
  resize:vertical;
  min-height:80px;
}
.progress {
  height:6px;
  background:#f3e4e7;
  border-radius:10px;
  margin-bottom:20px;
  overflow:hidden;
}
.bar {height:100%;background:#bc7b8e;transition:.4s}
.note {font-size:12px;color:#a77e87;margin-top:18px}
</style>
</head>
<body>

<main class="card" id="app">
  <div style="font-size: 40px; margin-bottom: 10px;">💌</div>
  <h1>¿Tenemos una dateeee?</h1>
  <p>Prepárate para una noche especial pensada solo para nosotros.</p>
  <div class="buttons">
    <button class="primary" onclick="next()">ACEPTAR</button>
    <button class="secondary" onclick="reject()">RECHAZAR</button>
  </div>
  <div class="note">Hecho con un poquito de amor ♡</div>
</main>

<script>
const answers = {
  dinner:"",
  dessert:"",
  movie:"",
  music:"",
  date:""
};

const whatsappNumber = "5493751358569"; // ACORDATE DE CAMBIAR ESTO POR TU NÚMERO

let step = 0;

function render(content) {
  const app = document.getElementById("app");
  app.style.animation = "none";
  void app.offsetWidth;
  app.style.animation = "appear .55s ease";
  app.innerHTML = content;
}

function progress(n) {
  return `<div class="progress"><div class="bar" style="width:${n/5*100}%"></div></div>`;
}

function reject() {
  render(`
    <div style="font-size: 40px; margin-bottom: 10px;">🥺</div>
    <h2>¿Segurísimo?</h2>
    <p>Prometo buena comida y linda compañía... pero si no querés, todo bien. ♡</p>
    <button class="primary full" onclick="next()">Bueno, ¡acepto! 💗</button>
    <button class="secondary full" onclick="decline()">No, gracias</button>
  `);
}

function decline() {
  render(`
    <h2>¡Gracias por responder!</h2>
    <p>No pasa nada. La invitación queda hecha sin presiones. ♡</p>
    <button class="secondary full" onclick="location.reload()">Volver al inicio</button>
  `);
}

function next() {
  step = 1;
  dinner();
}

function dinner() {
  render(`
    ${progress(1)}
    <h2>¿Qué cenamos?</h2>
    <p style="font-size: 13px; color: #a77e87;">Elegí tu opción favorita</p>
    <div class="options-stack">
      ${textOption('Tallarines caseros con salsita', 'dinner', '🍝')}
      ${textOption('Tarta de jamón y queso', 'dinner', '🥧')}
    </div>
    <button class="primary full" onclick="dessert()">Continuar ♡</button>
  `);
}

function dessert() {
  if(!answers.dinner) return alert("¡Elegí primero la cena! ♡");
  step = 2;
  render(`
    ${progress(2)}
    <h2>¿Y de postre?</h2>
    <p style="font-size: 13px; color: #a77e87;">Para endulzar un poco</p>
    <div class="options-stack">
      ${textOption('Tiramisú (ponele)', 'dessert', '🍰')}
      ${textOption('Heladito', 'dessert', '🍨')}
    </div>
    <button class="primary full" onclick="movie()">Siguiente ♡</button>
  `);
}

function movie() {
  if(!answers.dessert) return alert("¡Falta elegir el postre! ♡");
  step = 3;
  render(`
    ${progress(3)}
    <h2>¿Qué peli vemos?</h2>
    <p style="font-size: 13px; color: #a77e87;">Ponete cómodo</p>
    <div class="options-stack">
      ${textOption('Destino Oculto', 'movie', '🎬')}
      ${textOption('Paulie', 'movie', '🦜')}
    </div>
    <button class="primary full" onclick="suggestions()">Continuar ♡</button>
  `);
}

function textOption(name, key, icon) {
  const selected = answers[key] === name ? "selected" : "";
  return `
    <button class="option-btn ${selected}" onclick="choose('${key}','${name}',this)">
      <span>${name}</span>
      <span class="icon">${icon}</span>
    </button>
  `;
}

function choose(key, value, element) {
  answers[key] = value;
  element.parentElement.querySelectorAll(".option-btn").forEach(x => x.classList.remove("selected"));
  element.classList.add("selected");
}

function suggestions() {
  if(!answers.movie) return alert("¡Elegí una película! ♡");
  step = 4;
  render(`
    ${progress(4)}
    <h2>Cajita de sugerencias</h2>
    <p>Una canción, un detalle o lo que quieras acotar:</p>
    <textarea id="music" placeholder="Escribí tus sugerencias acá..."></textarea>
    <button class="primary full" onclick="dates()">¡Tengo una idea! ♡</button>
  `);
}

function dates() {
  const musicEl = document.getElementById("music");
  if(musicEl) answers.music = musicEl.value;
  
  step = 5;
  render(`
    ${progress(5)}
    <h2>Elegí la fecha</h2>
    <p style="font-size: 13px; color: #a77e87;">¿Cuándo nos juntamos?</p>
    <div class="options-stack">
      ${textOption('Sábado 07/11', 'date', '✨')}
      ${textOption('Domingo 08/11', 'date', '✨')}
      ${textOption('Sábado 14/11', 'date', '✨')}
    </div>
    <div class="note">Se aceptan sugerencias en la cajita anterior</div>
  `);
}

// Sobrescribimos temporalmente el choose para las fechas en este formato de lista
function choose(key, value, element) {
  answers[key] = value;
  element.parentElement.querySelectorAll(".option-btn").forEach(x => x.classList.remove("selected"));
  element.classList.add("selected");
  
  if(key === 'date') {
    setTimeout(finalScreen, 350);
  }
}

function finalScreen() {
  render(`
    <div style="font-size: 40px; margin-bottom: 5px;">🎉</div>
    <h2>¡Todo listo!</h2>
    <div style="text-align:left;background:#fff3f5;padding:14px;border-radius:14px;line-height:1.6;font-size:13px; margin-top: 15px;">
      🍽️ Cena: <b>${answers.dinner}</b><br>
      🍰 Postre: <b>${answers.dessert}</b><br>
      🎬 Película: <b>${answers.movie}</b><br>
      📅 Fecha: <b>${answers.date}</b><br>
      🎵 Sugerencia: ${answers.music ? escapeHTML(answers.music) : "Ninguna"}<br><br>
      ⏰ <b>Llegada:</b> 21:00 – 22:00 PUNTUAL<br>
      <i>(si no, llegar con vino en mano 🍷)</i>
    </div>
    <button class="primary full" onclick="sendWhatsApp()">CONFIRMAR ASISTENCIA 💌</button>
  `);
}

function escapeHTML(text) {
  return text.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function sendWhatsApp() {
  const text = `¡Mis elecciones para nuestra date! 💗

Cena: ${answers.dinner}
Postre: ${answers.dessert}
Película: ${answers.movie}
Fecha: ${answers.date}
Sugerencias: ${answers.music || "Ninguna"}

¡Nos vemos! ♡`;

  const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(text)}`;

  if(whatsappNumber.includes("TU_NUMERO")) {
    alert("Cami, acordate de cambiar 'TU_NUMERO' en el código por tu número de WhatsApp real con código de país.");
    return;
  }

  window.open(url, "_blank");
}
</script>
</body>
</html>
