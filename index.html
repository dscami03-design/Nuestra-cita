
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una cita especial ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');

:root {
  --pink:#e8aab9;
  --dark:#824c5c;
  --cream:#fff8f0;
  --light:#f9e9e9;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  background:linear-gradient(145deg,#f9e9e9,#fff8f0,#f6dce3);
  color:#60434a;
  font-family:'DM Sans',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.card {
  width:100%;
  max-width:440px;
  min-height:570px;
  background:rgba(255,255,255,.82);
  border:1px solid white;
  border-radius:28px;
  padding:30px 23px;
  text-align:center;
  box-shadow:0 15px 50px #a66b7720;
  animation:appear .55s ease;
}
@keyframes appear {
  from {opacity:0;transform:translateY(18px)}
  to {opacity:1;transform:translateY(0)}
}
.heart {font-size:42px;margin:8px 0 15px}
h1,h2 {font-family:'Playfair Display',serif;color:var(--dark)}
h1 {font-size:35px;line-height:1.2}
h2 {font-size:28px}
p {line-height:1.65;font-size:15px}
.small {font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#b27a88}
.buttons {display:flex;gap:12px;margin-top:28px}
button {
  font-family:inherit;
  cursor:pointer;
  border:0;
  border-radius:15px;
  padding:14px 18px;
  font-size:14px;
  font-weight:600;
  transition:.2s;
}
button:active {transform:scale(.96)}
.primary {background:var(--dark);color:white;flex:1}
.secondary {background:#f5e5e8;color:var(--dark);flex:1}
.full {width:100%;margin-top:18px}
.options {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:22px;
}
.option {
  background:#fffafa;
  border:2px solid #f1dce1;
  border-radius:18px;
  padding:13px 8px;
  color:var(--dark);
  font-weight:600;
  font-size:14px;
}
.option.selected {
  border-color:#a65d75;
  background:#fceaf0;
  box-shadow:0 0 0 3px #e8aab933;
}
.emoji {font-size:43px;display:block;margin-bottom:9px}
input,textarea {
  width:100%;
  border:1px solid #e8cbd3;
  background:#fffafa;
  border-radius:14px;
  padding:14px;
  font-family:inherit;
  color:#60434a;
  font-size:14px;
  margin-top:12px;
  outline:none;
}
textarea {resize:vertical;min-height:105px}
.progress {
  height:5px;
  background:#f3e4e7;
  border-radius:10px;
  margin-bottom:25px;
  overflow:hidden;
}
.bar {height:100%;background:#bc7b8e;transition:.4s}
.note {font-size:12px;color:#a77e87;margin-top:24px}
.date-option {
  display:block;
  width:100%;
  margin:10px 0;
  background:#fffafa;
  border:2px solid #f1dce1;
  color:var(--dark);
}
.date-option.selected {border-color:#a65d75;background:#fceaf0}
#message {font-size:13px;color:#a65d75;min-height:20px}
</style>
</head>
<body>

<main class="card" id="app">
  <div class="heart">💌</div>
  <div class="small">Una invitación especial</div>
  <h1>¿Tenemos una cita?</h1>
  <p>Tengo una propuesta para vos...</p>
  <p>Una noche, buena comida, algo rico de postre y una película. ¿Qué decís?</p>
  <p><b>Tu presencia es el ingrediente principal. ♡</b></p>
  <div class="buttons">
    <button class="primary" onclick="next()">¡Acepto! ♡</button>
    <button class="secondary" onclick="reject()">Rechazar</button>
  </div>
  <div id="message"></div>
  <div class="note">Hecho con un poquito de amor ♡</div>
</main>

<script>
const answers = {
  dinner:"",
  dessert:"",
  movie:"",
  music:"",
  date:""
};

// IMPORTANTE: reemplazar por tu número con código de país.
// Argentina: 549 + código de área + número, sin + ni espacios.
const whatsappNumber = "549TU_NUMERO";

let step = 0;

function render(content) {
  const app = document.getElementById("app");
  app.style.animation = "none";
  void app.offsetWidth;
  app.style.animation = "appear .55s ease";
  app.innerHTML = content;
}

function progress(n) {
  return `<div class="progress"><div class="bar" style="width:${n/6*100}%"></div></div>`;
}

function reject() {
  render(`
    <div class="heart">🥺</div>
    <h2>¿Segurísimo?</h2>
    <p>Prometo buena comida, postre y una noche linda... pero si no querés, está bien también. ♡</p>
    <button class="primary full" onclick="next()">Bueno, ¡acepto! 💗</button>
    <button class="secondary full" onclick="decline()">No, gracias</button>
  `);
}

function decline() {
  render(`
    <div class="heart">💗</div>
    <h2>¡Gracias por responder!</h2>
    <p>No pasa nada. La invitación queda hecha sin presiones. ♡</p>
    <button class="secondary full" onclick="location.reload()">Volver al inicio</button>
  `);
}

function next() {
  step = 1;
  dinner();
}

function dinner() {
  render(`
    ${progress(1)}
    <div class="heart">🍝</div>
    <div class="small">Primera elección</div>
    <h2>¿Qué vamos a cenar?</h2>
    <p>Elegí tu favorito. ¡Yo me encargo del resto!</p>
    <div class="options">
      ${option("Pasta","🍝","dinner")}
      ${option("Pizza","🍕","dinner")}
    </div>
    <button class="primary full" onclick="dessert()">Continuar ♡</button>
    <div class="note">Una decisión muy importante, claramente.</div>
  `);
}

function dessert() {
  if(!answers.dinner) return alert("¡Elegí primero la cena! ♡");
  step=2;
  render(`
    ${progress(2)}
    <div class="heart">🍓</div>
    <div class="small">Segunda elección</div>
    <h2>¿Y algo dulce?</h2>
    <p>Porque el postre nunca puede faltar.</p>
    <div class="options">
      ${option("Brownie","🍫","dessert")}
      ${option("Cheesecake","🍰","dessert")}
    </div>
    <button class="primary full" onclick="movie()">Siguiente ♡</button>
  `);
}

function movie() {
  if(!answers.dessert) return alert("¡Falta elegir el postre! ♡");
  step=3;
  render(`
    ${progress(3)}
    <div class="heart">🎬</div>
    <div class="small">Tercera elección</div>
    <h2>Plan de película</h2>
    <p>¿Qué ambiente le damos a nuestra noche?</p>
    <div class="options">
      ${option("Comedia romántica","💕","movie")}
      ${option("Suspenso","🍿","movie")}
    </div>
    <button class="primary full" onclick="suggestions()">Continuar ♡</button>
  `);
}

function option(name,emoji,key) {
  const selected=answers[key]===name?"selected":"";
  return `<button class="option ${selected}" onclick="choose('${key}','${name}',this)">
    <span class="emoji">${emoji}</span>${name}
  </button>`;
}

function choose(key,value,element) {
  answers[key]=value;
  element.parentElement.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));
  element.classList.add("selected");
}

function suggestions() {
  if(!answers.movie) return alert("¡Elegí una película! ♡");
  step=4;
  render(`
    ${progress(4)}
    <div class="heart">🎶</div>
    <div class="small">Un espacio para vos</div>
    <h2>¿Alguna sugerencia?</h2>
    <p>Una canción que quieras escuchar, algo que quieras comer o cualquier detalle que se te ocurra...</p>
    <textarea id="music" placeholder="Acá podés escribir lo que quieras..."></textarea>
    <button class="primary full" onclick="dates()">¡Tengo una idea! ♡</button>
  `);
}

function dates() {
  answers.music=document.getElementById("music").value;
  step=5;
  render(`
    ${progress(5)}
    <div class="heart">📅</div>
    <div class="small">Última decisión importante</div>
    <h2>¿Cuándo nos vemos?</h2>
    <p>Elegí la fecha que más te guste.</p>
    <button class="date-option" onclick="chooseDate('Viernes')">♡ Viernes</button>
    <button class="date-option" onclick="chooseDate('Sábado')">♡ Sábado</button>
    <button class="date-option" onclick="chooseDate('Domingo')">♡ Domingo</button>
    <div class="note">La fecha exacta la definimos juntos.</div>
  `);
}

function chooseDate(value) {
  answers.date=value;
  document.querySelectorAll(".date-option").forEach(x=>x.classList.remove("selected"));
  event.currentTarget.classList.add("selected");

  setTimeout(finalScreen,350);
}

function finalScreen() {
  render(`
    <div class="heart">💗</div>
    <div class="small">Nuestra pequeña cita</div>
    <h1>¡Tenemos un plan!</h1>
    <p>Este es nuestro pequeño menú de la noche:</p>
    <div style="text-align:left;background:#fff3f5;padding:17px;border-radius:17px;line-height:2">
      🍽️ Cena: <b>${answers.dinner}</b><br>
      🍰 Postre: <b>${answers.dessert}</b><br>
      🎬 Película: <b>${answers.movie}</b><br>
      📅 Día elegido: <b>${answers.date}</b><br>
      🎵 Sugerencia: ${answers.music ? escapeHTML(answers.music) : "Ninguna"}
    </div>
    <h2>¡Ahora solo falta que llegue el día! 🥹</h2>
    <p>Gracias por aceptar esta pequeña aventura conmigo. ♡</p>
    <button class="primary full" onclick="sendWhatsApp()">Enviar mis elecciones 💌</button>
    <div class="note">La mejor parte todavía está por venir.</div>
  `);
}

function escapeHTML(text) {
  return text.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function sendWhatsApp() {
  const text = `¡Mis elecciones para nuestra cita! 💗

Cena: ${answers.dinner}
Postre: ${answers.dessert}
Película: ${answers.movie}
Día elegido: ${answers.date}
Sugerencias: ${answers.music || "Ninguna"}

¡Nos vemos! ♡`;

  const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(text)}`;

  if(whatsappNumber.includes("TU_NUMERO")) {
    alert("Todavía falta configurar el número de WhatsApp de quien recibirá las respuestas. ¡Lo hacemos juntas!");
    return;
  }

  window.open(url,"_blank");
}
</script>
</body>
  </html>
